name: EAS Build & Update

on:
  workflow_dispatch:
    inputs:
      action:
        description: Pilih aksi (update = OTA cepat, build = APK/AAB baru)
        default: update
        type: choice
        options:
          - update
          - build
      target:
        description: Profil build atau branch update (preview atau production)
        default: preview
        type: choice
        options:
          - preview
          - production
      message:
        description: Pesan update (dipakai saat action = update)
        default: Update aplikasi CodBer
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fix Expo package versions
        run: npx expo install --fix

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Run EAS Update (OTA)
        if: github.event.inputs.action == 'update'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --branch ${{ github.event.inputs.target }} --message "${{ github.event.inputs.message }}" --non-interactive

      - name: Run EAS Build (Android)
        if: github.event.inputs.action == 'build'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile ${{ github.event.inputs.target }} --non-interactive --no-wait
