# Build APK dari GitHub tanpa laptop: tab Actions -> "EAS Build" -> Run workflow.
# Butuh 1 secret repo: EXPO_TOKEN. Variabel EXPO_PUBLIC_* diisi di expo.dev (Project > Environment variables),
# karena build berjalan di server EAS, bukan di GitHub. Build PERTAMA harus interaktif (buat keystore), lihat PANDUAN_PUBLISH.md.
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profil build (preview = APK uji, production = rilis)
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fix Expo package versions
        run: npx expo install --fix

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Run EAS Build (Android)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait
