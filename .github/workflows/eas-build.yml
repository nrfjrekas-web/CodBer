# Build APK dari GitHub tanpa laptop: tab Actions -> "EAS Build" -> Run workflow.
# Butuh 1 secret repo: EXPO_TOKEN. Variabel EXPO_PUBLIC_* diisi di expo.dev (Project > Environment variables),
# karena build berjalan di server EAS, bukan di GitHub. Build PERTAMA harus interaktif (buat keystore), lihat PANDUAN_PUBLISH.md.
name: EAS Build
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profil build (preview = APK uji, production = rilis)
        default: preview
        type: choice
        options: [preview, production]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }
      - run: npm install
      - run: npx expo install --fix
      - run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait

